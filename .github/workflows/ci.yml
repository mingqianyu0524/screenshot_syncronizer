name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ────────────────────────────────────────────────
  # Job 1: Python 语法检查
  # ────────────────────────────────────────────────
  syntax-check:
    name: Python Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pyflakes
        run: pip install pyflakes

      - name: Check syntax (py_compile)
        run: python -m py_compile main.py server.py client.py llm.py

      - name: Check for undefined names (pyflakes)
        run: python -m pyflakes main.py server.py client.py llm.py

  # ────────────────────────────────────────────────
  # Job 2: Telegram 通知
  # 无论 CI 成功或失败都会触发
  # ────────────────────────────────────────────────
  notify:
    name: Telegram Notification
    runs-on: ubuntu-latest
    needs: [syntax-check]
    if: always()

    steps:
      - name: Build and send Telegram message
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CI_STATUS: ${{ needs.syntax-check.result }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # 状态图标
          if [ "$CI_STATUS" = "success" ]; then
            ICON="✅"
            STATUS_TEXT="通过"
          else
            ICON="❌"
            STATUS_TEXT="失败"
          fi

          # 事件来源 & 链接
          if [ "$EVENT" = "pull_request" ]; then
            TARGET="PR #${PR_NUMBER}: ${PR_TITLE}"
            LINK="${PR_URL}"
          else
            TARGET="Push → ${REF}"
            LINK="${SERVER_URL}/${REPO}/commit/${SHA}"
          fi

          SHORT_SHA="${SHA:0:7}"

          MESSAGE="${ICON} screenshot_syncronizer CI ${STATUS_TEXT}

📦 ${TARGET}
👤 ${ACTOR}
🔖 ${SHORT_SHA}
🔗 ${LINK}"

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg chat_id "$CHAT_ID" \
              --arg text "$MESSAGE" \
              '{chat_id: $chat_id, text: $text}')"
